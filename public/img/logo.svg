<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffd700;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#ffed4a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#b8860b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="darkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a1a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0a0a0a;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background Circle -->
  <circle cx="50" cy="50" r="48" fill="url(#darkGrad)" stroke="url(#goldGrad)" stroke-width="3"/>
  
  <!-- Diamond Shape -->
  <polygon points="50,15 75,50 50,85 25,50" fill="none" stroke="url(#goldGrad)" stroke-width="3" filter="url(#glow)"/>
  
  <!-- Inner Diamond -->
  <polygon points="50,28 64,50 50,72 36,50" fill="url(#goldGrad)" opacity="0.8"/>
  
  <!-- Letter G -->
  <text x="50" y="58" font-family="Arial Black, sans-serif" font-size="28" font-weight="900" 
        fill="#0a0a0a" text-anchor="middle" dominant-baseline="middle">G</text>
  
  <!-- Gold Particles -->
  <circle cx="25" cy="25" r="2" fill="#ffd700" opacity="0.8">
    <animate attributeName="opacity" values="0.8;0.2;0.8" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="75" cy="30" r="1.5" fill="#ffd700" opacity="0.6">
    <animate attributeName="opacity" values="0.6;0.1;0.6" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="80" cy="70" r="2" fill="#ffd700" opacity="0.7">
    <animate attributeName="opacity" values="0.7;0.3;0.7" dur="3.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="20" cy="70" r="1.5" fill="#ffd700" opacity="0.5">
    <animate attributeName="opacity" values="0.5;0.1;0.5" dur="2.8s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Ring -->
  <circle cx="50" cy="50" r="42" fill="none" stroke="#ffd700" stroke-width="0.5" opacity="0.3">
    <animate attributeName="r" values="42;44;42" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.3;0.5;0.3" dur="4s" repeatCount="indefinite"/>
  </circle>
</svg>
